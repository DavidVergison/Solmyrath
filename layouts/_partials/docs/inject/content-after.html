{{- $gallery := .Resources.Match "galery/*" -}}
{{- if $gallery -}}
<div class="gallery-carousel">
  <div class="gallery-track">
    {{- range $gallery -}}
    <a href="{{ .RelPermalink }}" target="_blank" class="gallery-slide">
      <img src="{{ .RelPermalink }}" alt="{{ .Name }}" />
    </a>
    {{- end -}}
  </div>
  <button class="gallery-prev" aria-label="Précédent">&#8249;</button>
  <button class="gallery-next" aria-label="Suivant">&#8250;</button>
</div>
<script>
(function() {
  var carousel = document.querySelector('.gallery-carousel');
  if (!carousel) return;
  var track = carousel.querySelector('.gallery-track');
  var slides = carousel.querySelectorAll('.gallery-slide');
  var prev = carousel.querySelector('.gallery-prev');
  var next = carousel.querySelector('.gallery-next');
  var index = 0;
  var visible = 3;
  var max = Math.max(0, slides.length - visible);

  function update() {
    var gap = 12;
    var slideWidth = slides[0].offsetWidth + gap;
    track.style.transform = 'translateX(-' + (index * slideWidth) + 'px)';
    prev.disabled = index <= 0;
    next.disabled = index >= max;
  }

  prev.addEventListener('click', function() { if (index > 0) { index--; update(); } });
  next.addEventListener('click', function() { if (index < max) { index++; update(); } });

  window.addEventListener('load', update);
  window.addEventListener('resize', update);
})();
</script>
{{- end -}}
